name = "dreamina-mail-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"

# R2 存储桶绑定
# 1. 创建 R2 bucket: wrangler r2 bucket create mailboxes
# 2. 将 bucket 名称填写到下方
[[r2_buckets]]
binding = "mailboxes"
bucket_name = "mailboxes"

# 环境变量
[vars]
EMAIL_DOMAIN = "boomstyleai.com"
ADMIN_PASSWORD = "huigeai!@#123"

# 自定义域名 (需要在 Cloudflare Dashboard > Workers > 设置中配置)
# Custom Domain: mail.boomstyleai.com
# 或使用 routes:
# [[routes]]
# pattern = "mail.boomstyleai.com/*"
# zone_name = "boomstyleai.com"

# Email 路由配置
# 1. 在 Cloudflare Dashboard > boomstyleai.com > Email > Email Routing 中启用
# 2. 设置 Catch-all address 规则，将所有邮件转发到此 Worker (dreamina-mail-worker)
# 3. 在 Workers > dreamina-mail-worker > Settings > Custom Domains 添加 mail.boomstyleai.com
